<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arquero Global Script Example</title>
    
    <!-- 1. Load Arquero as a global library -->
    <script src="https://cdn.jsdelivr.net/npm/arquero@latest"></script>
</head>
<body>

    <script>
        // 2. The library is automatically attached to the 'aq' window object
        const dt = aq.table({
            'category': ['Electronics', 'Clothing', 'Electronics', 'Home'],
            'sales': [1200, 45, 300, 85],
            'quantity': [2, 1, 1, 3]
        });

        // 3. Perform your groupings and analysis using 'aq.op'
        const analysis = dt
            .groupby('category')
            .rollup({
                total_sales: d => aq.op.sum(d.sales),
                transaction_count: aq.op.count()
            })
            .orderby(aq.desc('total_sales'));

        // Print to the browser console
        analysis.print();
    </script>
    
</body>
</html>

<input type="file" id="csv-file">

<script type="module">
    import Papa from 'https://cloudflare.com';

    document.getElementById('csv-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        
        Papa.parse(file, {
            worker: true,  // Runs in background thread, zero UI lag!
            header: true,  // Automatically maps first row as column keys
            dynamicTyping: true, // Auto-converts numbers and booleans
            complete: function(results) {
                console.log("Parsed JSON Data Array:", results.data);
                // Ready to feed straight into Arquero or process via JS!
            }
        });
    });
</script>
